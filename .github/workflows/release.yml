name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore & Test
        run: dotnet test OpenFrameGen.sln -c Release

      - name: Publish OpenFrameGen.exe (Single-File Framework-Dependent)
        run: |
          dotnet publish src/OpenFrameGen.App/OpenFrameGen.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o artifacts/app

      - uses: actions/upload-artifact@v4
        with:
          name: app-win64
          path: artifacts/app/OpenFrameGen.exe

  build-driver-win64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.3.0
        with:
          vulkan-version: '1.3.296.0'
          vulkan-components: 'Vulkan-Headers, Vulkan-Loader'
          vulkan-use-cache: true

      - name: Configure & Build Vulkan Layer (Win64)
        run: |
          cmake -S driver/vulkan-layer -B driver/vulkan-layer/build -G "Visual Studio 17 2022" -A x64
          cmake --build driver/vulkan-layer/build --config Release
          cmake --install driver/vulkan-layer/build --config Release --prefix artifacts/driver-win64

      - name: Package Driver Zip
        run: Compress-Archive -Path artifacts/driver-win64/* -DestinationPath artifacts/open-framegen-driver-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: driver-win64
          path: artifacts/open-framegen-driver-win64.zip

  build-driver-linux64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan Dev Packages
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libvulkan-dev

      - name: Configure & Build Vulkan Layer (Linux64 / Steam Deck)
        run: |
          cmake -S driver/vulkan-layer -B driver/vulkan-layer/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build driver/vulkan-layer/build
          cmake --install driver/vulkan-layer/build --prefix artifacts/driver-linux64
          tar -czf artifacts/open-framegen-driver-linux64.tar.gz -C artifacts/driver-linux64 .

      - uses: actions/upload-artifact@v4
        with:
          name: driver-linux64
          path: artifacts/open-framegen-driver-linux64.tar.gz

  release:
    needs: [build-app, build-driver-win64, build-driver-linux64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'v0.1.0' || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/OpenFrameGen.exe
            release-assets/open-framegen-driver-win64.zip
            release-assets/open-framegen-driver-linux64.tar.gz
